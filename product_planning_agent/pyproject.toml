[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-planning-agent"
version = "0.1.0"
description = "An agent that interrogates a requirement into a versioned, auditable planning ledger."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "claude-agent-sdk>=0.2.158",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
]

[project.scripts]
ppa = "ppa.cli:app"

[tool.setuptools.packages.find]
include = ["ppa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ppa"]
